version: '3'

services:
  front-end:
    build: ${FRONT_END_PATH}
    image: ${FRONT_END_NAME}:${TAG}
    volumes:
      - type: bind
        source: ${FRONT_END_PATH}
        target: /app
    ports: 
      - ${FRONT_END_PORT}:3000
    expose:
      - ${FRONT_END_PORT}
    command: "npm start"

